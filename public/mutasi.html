<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutasi - Monitoring Sparepart Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app-root"></div>

<template id="layout-header">
  <header class="topbar">
    <div class="flex flex-wrap items-center justify-between gap-x-4">
      <div class="flex items-center gap-3 py-3 min-w-0">
        <div style="background:var(--accent);color:var(--accent-fg)" class="w-9 h-9 rounded-md flex items-center justify-center font-bold">GPL</div>
        <div class="min-w-0"><div class="font-bold leading-tight">Monitoring Sparepart Gudang</div><div class="text-xs" style="color:var(--muted)">PT. Gorontalo Panel Lestari · Gudang Mill</div></div>
      </div>
      <nav class="flex overflow-x-auto" role="menu" aria-label="Menu">
        <a class="tab" href="/dashboard" role="menuitem">Dashboard</a>
        <a class="tab" href="/data" role="menuitem">Data Sparepart</a>
        <a class="tab" href="/mutasi" role="menuitem">Mutasi</a>
      </nav>
      <button class="btn sm" id="btnLogout" title="Keluar">Keluar</button>
    </div>
  </header>
</template>

<template id="layout-login">
  <div id="login" hidden>
    <div class="login-wrap"><form id="loginForm" class="card p-6 w-full" style="max-width:380px">
      <div class="flex items-center gap-3 mb-5"><div style="background:var(--accent);color:var(--accent-fg)" class="w-10 h-10 rounded-md flex items-center justify-center font-bold">GPL</div>
        <div><div class="font-bold leading-tight">Monitoring Sparepart Gudang</div><div class="text-xs" style="color:var(--muted)">PT. Gorontalo Panel Lestari</div></div></div>
      <label class="lb" for="lpw">Password</label><input id="lpw" class="field" type="password" autocomplete="current-password" required>
      <div class="err" id="lerr"></div>
      <button class="btn pri justify-center w-full mt-4" type="submit">Masuk</button>
    </form></div>
  </div>
  <div id="boot" class="text-sm" style="color:var(--muted);padding:24px">Memuat...</div>
</template>

<template id="layout-modal-toast">
  <div id="modal"></div><div id="toastBox"></div>
</template>

<template id="page-mutasi">
  <div class="wrap">
    <div id="header-slot"></div>
    <main class="py-5 flex flex-col gap-5">
      <div class="grid gap-5 lg:grid-cols-5">
        <form class="card p-4 lg:col-span-2 self-start flex flex-col gap-3" id="mform" autocomplete="off">
          <div><h2 class="font-bold">Catat Mutasi Stok</h2><p class="text-xs mt-1" style="color:var(--muted)">Langsung menambah (IN) atau mengurangi (OUT) Stok Sekarang.</p></div>
          <div><label class="lb" for="mk">Kategori</label><select id="mk" class="field"></select></div>
          <div><label class="lb" for="mfind">Cari tipe</label><input id="mfind" class="field" type="search" placeholder="ketik untuk menyaring daftar tipe"></div>
          <div><label class="lb" for="mt">Tipe / Nama Sparepart</label><select id="mt" class="field"></select>
            <div class="text-xs mt-1.5" id="minfo" style="color:var(--muted)"></div></div>
          <div><span class="lb">Jenis mutasi</span>
            <div class="grid grid-cols-2 gap-2"><label class="btn in justify-center" style="cursor:pointer"><input type="radio" name="mj" value="IN" checked> IN (masuk)</label><label class="btn out justify-center" style="cursor:pointer"><input type="radio" name="mj" value="OUT"> OUT (keluar)</label></div></div>
          <div class="grid grid-cols-2 gap-3"><div><label class="lb" for="mq">Jumlah</label><input id="mq" class="field mono" type="number" min="0" step="any" inputmode="decimal"></div>
            <div><label class="lb" for="md">Tanggal</label><input id="md" class="field" type="date"></div></div>
          <div><label class="lb" for="mpic">PIC</label><input id="mpic" class="field" type="text" placeholder="nama penerima / penyerah"></div>
          <div><label class="lb" for="mn">Catatan</label><input id="mn" class="field" type="text" placeholder="nomor PO, mesin, keperluan (opsional)"></div>
          <div><label class="lb" for="mfile">Bukti (foto / PDF, opsional)</label><input id="mfile" class="field" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div>
          <div class="err" id="merr"></div>
          <button type="submit" class="btn pri justify-center">Simpan Mutasi</button>
        </form>
        <div class="card lg:col-span-3 min-w-0 self-start">
          <div class="p-4 pb-2"><h2 class="font-bold">Riwayat mutasi</h2><p class="text-xs mt-1" style="color:var(--muted)">Tersimpan di database, terbaru di atas.</p></div>
          <div class="scroll-x" style="max-height:70vh;overflow-y:auto"><table class="tbl" style="min-width:900px"><thead><tr><th style="cursor:default">Tanggal</th><th style="cursor:default">Jenis</th><th style="cursor:default">Kategori</th><th style="cursor:default">Sparepart</th><th class="r" style="cursor:default">Jumlah</th><th class="r" style="cursor:default">Stok akhir</th><th style="cursor:default">PIC</th><th style="cursor:default">Catatan</th><th style="cursor:default">Bukti</th></tr></thead><tbody id="logbody"></tbody></table></div>
        </div>
      </div>
    </main>
  </div>
</template>

<script type="module">
import { initApp, renderMutasi, showLogin, checkAuth, injectHeader } from '/assets/app.js';

document.getElementById('app-root').innerHTML = `
  ${document.getElementById('layout-login').innerHTML}
  <div id="app" hidden>${document.getElementById('page-mutasi').innerHTML}</div>
  ${document.getElementById('layout-modal-toast').innerHTML}
`;

await initApp();
injectHeader('/mutasi');

checkAuth().then(authed => {
  if (!authed) return showLogin();
  document.getElementById('boot').hidden = true;
  document.getElementById('app').hidden = false;
  renderMutasi();
});
</script>
</body>
</html>
